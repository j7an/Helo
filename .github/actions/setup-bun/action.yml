name: Setup Bun
description: Install Bun and project dependencies
inputs:
  bun-version:
    description: "Bun version to install"
    required: false
    default: "1.3"
runs:
  using: "composite"
  steps:
    - name: Install Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: ${{ inputs.bun-version }}
    - name: Install dependencies
      run: bun install --frozen-lockfile
      shell: bash
